baseURL: "https://example.org/"
languageCode: "en-us"
title: "hugo-orangeru-events exampleSite"

disableKinds:
  - taxonomy
  - term

module:
  imports:
    - path: github.com/orangeru-work/hugo-orangeru-events

outputFormats:
  Calendar:
    protocol: "https://"

params:
  eventsCalendar:
    showSubscribeButton: true
    calendarName: "Orangeru Events Example"
    calendarDescription: "Example ICS feed generated by hugo-orangeru-events."
    categoryColors:
      club: "#bfdbfe"
      social: "#fde68a"
      race: "#fecaca"
