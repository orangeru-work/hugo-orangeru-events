<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1d4ed8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href='{{ "manifest.webmanifest" | relURL }}'>
    <link rel="icon" href='{{ "icons/icon.svg" | relURL }}' type="image/svg+xml">
    <link rel="icon" href='{{ "icons/icon-192.png" | relURL }}' sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href='{{ "icons/icon-192.png" | relURL }}'>
    <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
        color: #111827;
      }
      main {
        max-width: 60rem;
        margin: 0 auto;
        padding: 1.2rem 1rem 3rem;
      }
      a {
        color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('{{ "sw.js" | relURL }}');
        });
      }
    </script>
  </body>
</html>
