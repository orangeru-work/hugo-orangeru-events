name: facebook-events-sync

on:
  workflow_dispatch:

  # Optional: enable automatic runs by uncommenting this block.
  # push:
  #   branches:
  #     - main
  # schedule:
  #   - cron: "17 13-23 * * *" # hourly 6am-4pm America/Phoenix (UTC-7)
  #   - cron: "17 0-1 * * *"   # hourly 5pm-6pm America/Phoenix (UTC-7)

permissions:
  contents: write

env:
  TZ: America/Phoenix
  EVENTS_MODULE_VERSION: latest

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Fetch latest events.ics
        env:
          FACEBOOK_EVENTS_ICS_URL_SECRET: ${{ secrets.FACEBOOK_EVENTS_ICS_URL }}
          FACEBOOK_EVENTS_ICS_URL_VAR: ${{ vars.FACEBOOK_EVENTS_ICS_URL }}
        run: |
          FACEBOOK_EVENTS_ICS_URL="$FACEBOOK_EVENTS_ICS_URL_SECRET"
          if [ -z "$FACEBOOK_EVENTS_ICS_URL" ]; then
            FACEBOOK_EVENTS_ICS_URL="$FACEBOOK_EVENTS_ICS_URL_VAR"
          fi

          if [ -z "$FACEBOOK_EVENTS_ICS_URL" ]; then
            echo "FACEBOOK_EVENTS_ICS_URL is required as a secret or repository variable."
            exit 1
          fi

          curl --fail --silent --show-error --location \
            "$FACEBOOK_EVENTS_ICS_URL" \
            --output /tmp/events.ics

      - name: Generate event content
        run: |
          go run github.com/orangeru-work/hugo-orangeru-events/cmd/facebook-events@${EVENTS_MODULE_VERSION} \
            --ics /tmp/events.ics \
            --output site/content/events \
            --cancelled cancelled-events.txt \
            --include-private=false \
            --category-going club \
            --category-interested other \
            --category-default other

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/content/events

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "events: sync Facebook calendar updates"
          git push
